<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Adivina la Profesion! — Spanish Game Show</title>
<style>
  /* =====================================================
     THEME — neon TV-show dark mode
     ===================================================== */
  :root {
    --neon-blue:   #00e5ff;
    --neon-cyan:   #29ffe7;
    --neon-purple: #b026ff;
    --neon-pink:   #ff2d95;
    --neon-gold:   #ffd24a;
    --bg-0: #04030d;
    --bg-1: #0b0a24;
    --bg-2: #15103a;
    --text:  #f4f6ff;
    --muted: #9aa0c7;
    --glow-blue:   0 0 6px var(--neon-blue),  0 0 18px var(--neon-blue),  0 0 36px rgba(0,229,255,.55);
    --glow-purple: 0 0 6px var(--neon-purple),0 0 22px var(--neon-purple),0 0 44px rgba(176,38,255,.55);
    --glow-pink:   0 0 6px var(--neon-pink),  0 0 18px var(--neon-pink);
    --glow-gold:   0 0 8px var(--neon-gold),  0 0 22px var(--neon-gold);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(1200px 800px at 20% 10%, rgba(176,38,255,.18), transparent 60%),
      radial-gradient(1000px 700px at 80% 90%, rgba(0,229,255,.15), transparent 60%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0));
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
    letter-spacing: .02em;
  }

  /* subtle moving grid in the background */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(0,229,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(176,38,255,.06) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, #000 40%, transparent 80%);
    pointer-events:none;
    animation: gridShift 18s linear infinite;
    z-index:0;
  }
  @keyframes gridShift {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 48px 48px, -48px 48px; }
  }

  /* =====================================================
     SCREENS
     ===================================================== */
  .screen{
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 1;
  }
  .screen.active { display: flex; animation: fadeIn .5s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.985);} to { opacity: 1; transform: scale(1);} }

  /* =====================================================
     BUTTONS
     ===================================================== */
  .neon-btn{
    position: relative;
    cursor: pointer;
    font: 700 1.05rem/1 "Segoe UI", sans-serif;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--text);
    padding: 18px 38px;
    background: linear-gradient(135deg, rgba(0,229,255,.12), rgba(176,38,255,.18));
    border: 2px solid var(--neon-blue);
    border-radius: 999px;
    box-shadow: var(--glow-blue), inset 0 0 18px rgba(0,229,255,.25);
    transition: transform .2s ease, box-shadow .3s ease, background .3s ease;
  }
  .neon-btn:hover{
    transform: translateY(-2px) scale(1.03);
    background: linear-gradient(135deg, rgba(176,38,255,.25), rgba(0,229,255,.25));
    box-shadow: var(--glow-purple), inset 0 0 24px rgba(176,38,255,.35);
    border-color: var(--neon-purple);
  }
  .neon-btn:active{ transform: translateY(0) scale(.99); }
  .neon-btn.gold{
    border-color: var(--neon-gold);
    box-shadow: var(--glow-gold), inset 0 0 18px rgba(255,210,74,.25);
  }
  .neon-btn.pink{
    border-color: var(--neon-pink);
    box-shadow: var(--glow-pink), inset 0 0 18px rgba(255,45,149,.25);
  }
  .neon-btn.small{ padding: 10px 18px; font-size: .85rem; letter-spacing: .18em; }

  .ghost-btn{
    cursor:pointer;
    background: transparent; color: var(--muted);
    border: 1px solid rgba(154,160,199,.3);
    padding: 8px 14px; border-radius: 8px;
    font-size: .8rem; letter-spacing: .15em; text-transform: uppercase;
    transition: color .2s, border-color .2s;
  }
  .ghost-btn:hover{ color:var(--text); border-color: var(--neon-blue); }

  /* =====================================================
     START SCREEN
     ===================================================== */
  #start-screen .start-stack{ display:flex; flex-direction:column; align-items:center; gap:36px; }
  .show-tag{
    color: var(--neon-cyan);
    letter-spacing: .6em;
    font-size: .75rem;
    text-transform: uppercase;
    text-shadow: var(--glow-blue);
  }
  .start-title{
    font-size: clamp(2.2rem, 6vw, 4.6rem);
    font-weight: 900;
    text-align:center;
    line-height: 1;
    background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(176,38,255,.45));
    animation: titlePulse 3s ease-in-out infinite;
  }
  @keyframes titlePulse{
    0%,100%{ filter: drop-shadow(0 0 12px rgba(0,229,255,.45)); }
    50%    { filter: drop-shadow(0 0 26px rgba(176,38,255,.7)); }
  }
  #start-btn{ padding: 22px 56px; font-size: 1.25rem; }

  /* =====================================================
     LOGO SCREEN
     ===================================================== */
  #logo-screen{ background: radial-gradient(circle at center, rgba(176,38,255,.25), transparent 60%); }
  .logo-wrap{
    position: relative;
    display:flex; align-items:center; justify-content:center;
    width: min(80vw, 720px); height: min(80vw, 720px);
  }
  .logo-ring{
    position:absolute; inset:0;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--neon-blue);
    border-right-color: var(--neon-purple);
    box-shadow: var(--glow-blue);
    animation: spin 4s linear infinite;
  }
  .logo-ring.r2{
    inset: 8%;
    border-top-color: var(--neon-purple);
    border-right-color: var(--neon-pink);
    animation-duration: 6s;
    animation-direction: reverse;
    box-shadow: var(--glow-purple);
  }
  .logo-ring.r3{
    inset: 16%;
    border-top-color: var(--neon-pink);
    border-right-color: var(--neon-cyan);
    animation-duration: 3s;
    box-shadow: var(--glow-pink);
  }
  @keyframes spin{ to { transform: rotate(360deg);} }
  .logo-core{
    position: relative; z-index: 2;
    text-align: center;
    padding: 28px;
    background: radial-gradient(circle at center, rgba(11,10,36,.9), rgba(11,10,36,.4));
    border-radius: 24px;
    animation: zoomIn .6s ease-out;
  }
  @keyframes zoomIn { from { transform: scale(.6); opacity: 0;} to { transform: scale(1); opacity: 1;} }
  .logo-core .upper{ color: var(--neon-cyan); letter-spacing: .5em; font-size: .9rem; text-shadow: var(--glow-blue); }
  .logo-core .main{
    margin: 14px 0;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(0,229,255,.6));
    line-height: 1;
  }
  .logo-core .lower{ color: var(--neon-pink); letter-spacing: .35em; font-size: .85rem; text-shadow: var(--glow-pink);}

  /* =====================================================
     BOARD SCREEN — scoreboard + crossword
     ===================================================== */
  #board-screen{ overflow-y:auto; }
  #board-screen.active{ display:flex; }

  .scoreboard{
    width: min(1100px, 96vw);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 18px;
    align-items: center;
    margin-top: 8px;
    margin-bottom: 22px;
  }
  .team{
    background: linear-gradient(135deg, rgba(0,229,255,.08), rgba(176,38,255,.12));
    border: 1px solid rgba(0,229,255,.25);
    border-radius: 16px;
    padding: 14px 18px;
    box-shadow: 0 0 24px rgba(0,229,255,.12), inset 0 0 18px rgba(0,229,255,.06);
    display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .team.b{
    border-color: rgba(255,45,149,.3);
    background: linear-gradient(135deg, rgba(176,38,255,.10), rgba(255,45,149,.10));
    box-shadow: 0 0 24px rgba(255,45,149,.12), inset 0 0 18px rgba(255,45,149,.06);
  }
  .team h2{
    font-size: 1rem; letter-spacing: .35em; color: var(--neon-cyan);
    text-shadow: var(--glow-blue); text-transform:uppercase;
  }
  .team.b h2{ color: var(--neon-pink); text-shadow: var(--glow-pink);}
  .score-block{ display:flex; align-items:center; gap: 10px;}
  .score{
    font-size: 2.4rem; font-weight: 900; min-width: 60px; text-align:center;
    text-shadow: var(--glow-blue);
  }
  .team.b .score{ text-shadow: var(--glow-pink);}
  .score-controls{ display:flex; gap:6px; }
  .score-controls button{
    cursor:pointer;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.05);
    color: var(--text);
    font-size: 1.2rem; font-weight: 700;
    transition: transform .15s, background .2s;
  }
  .score-controls button:hover{ background: rgba(0,229,255,.2); transform: scale(1.1); }
  .vs{
    font-size: 1.6rem; font-weight: 900;
    color: var(--neon-gold);
    text-shadow: var(--glow-gold);
    letter-spacing: .15em;
    padding: 0 8px;
  }

  /* crossword */
  .crossword-wrap{
    width: min(1100px, 96vw);
    background: linear-gradient(180deg, rgba(11,10,36,.6), rgba(4,3,13,.6));
    border: 1px solid rgba(176,38,255,.25);
    border-radius: 18px;
    padding: 28px 18px;
    box-shadow: 0 0 36px rgba(176,38,255,.18), inset 0 0 28px rgba(0,229,255,.04);
  }
  .crossword{
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: stretch;
  }
  .word-row{
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .word-num{
    cursor: pointer;
    width: 56px; height: 56px;
    border-radius: 14px;
    display:flex; align-items:center; justify-content:center;
    font-weight: 900; font-size: 1.6rem;
    color: var(--bg-0);
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
    box-shadow: var(--glow-blue);
    transition: transform .2s ease, box-shadow .2s ease;
    margin-right: 6px;
  }
  .word-num:hover{ transform: scale(1.08) rotate(-3deg); box-shadow: var(--glow-purple);}
  .word-num.done{
    background: linear-gradient(135deg, var(--neon-gold), #ff8a00);
    color: #2a1d00;
    box-shadow: var(--glow-gold);
  }
  .cell{
    width: 50px; height: 56px;
    border-radius: 8px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(0,229,255,.25);
    display:flex; align-items:center; justify-content:center;
    font-weight: 800; font-size: 1.5rem;
    color: var(--text);
    text-shadow: 0 0 10px rgba(0,229,255,.6);
    transition: transform .25s ease, background .3s ease, box-shadow .3s ease;
  }
  .cell.revealed{
    background: linear-gradient(135deg, rgba(0,229,255,.18), rgba(176,38,255,.18));
    border-color: var(--neon-purple);
    box-shadow: 0 0 18px rgba(176,38,255,.4);
    animation: pop .35s ease-out;
  }
  @keyframes pop{
    0% { transform: scale(.6) rotateY(180deg); opacity: 0;}
    100% { transform: scale(1) rotateY(0); opacity: 1;}
  }

  .board-actions{
    width: min(1100px, 96vw);
    display:flex; justify-content: center; margin: 26px 0 12px;
  }

  /* =====================================================
     MODAL — hint
     ===================================================== */
  .modal{
    position: fixed; inset: 0;
    display:none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(8px);
    z-index: 50;
  }
  .modal.active{ display:flex; animation: fadeIn .25s ease-out; }
  .modal-card{
    position: relative;
    width: min(560px, 92vw);
    background: linear-gradient(160deg, rgba(21,16,58,.95), rgba(11,10,36,.95));
    border: 1px solid var(--neon-purple);
    border-radius: 22px;
    box-shadow: var(--glow-purple);
    padding: 36px 28px;
    text-align: center;
    animation: zoomIn .35s ease-out;
  }
  .modal-card h2{
    font-size: 1.6rem;
    letter-spacing: .3em;
    color: var(--neon-cyan);
    text-shadow: var(--glow-blue);
    margin-bottom: 22px;
  }
  .modal-emojis{
    display:flex; justify-content:center; gap: 22px;
    margin: 22px 0 28px;
    min-height: 92px;
  }
  .modal-emojis span{
    font-size: 3.6rem;
    filter: drop-shadow(0 0 12px rgba(0,229,255,.5));
    animation: emojiIn .5s ease-out backwards;
  }
  .modal-emojis span:nth-child(1){ animation-delay: .05s; }
  .modal-emojis span:nth-child(2){ animation-delay: .25s; }
  .modal-emojis span:nth-child(3){ animation-delay: .45s; }
  @keyframes emojiIn{
    from { opacity:0; transform: translateY(20px) scale(.6);}
    to   { opacity:1; transform: translateY(0) scale(1);}
  }
  .modal-actions{ display:flex; gap: 14px; justify-content:center; flex-wrap:wrap; }
  .modal-close{
    position: absolute; top: 12px; right: 12px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.04);
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
  }
  .modal-close:hover{ color: var(--neon-pink); border-color: var(--neon-pink); }
  .hidden{ display:none !important; }
  .final-note{
    margin: 8px 0 22px;
    color: var(--neon-gold);
    text-shadow: var(--glow-gold);
    letter-spacing: .25em;
    font-size: .85rem;
    text-transform: uppercase;
  }

  /* =====================================================
     REVEAL SCREEN
     ===================================================== */
  #reveal-screen{
    background:
      radial-gradient(circle at center, rgba(255,210,74,.18), transparent 60%),
      radial-gradient(circle at 30% 30%, rgba(176,38,255,.25), transparent 70%),
      radial-gradient(circle at 70% 70%, rgba(0,229,255,.25), transparent 70%);
  }
  .reveal-wrap{ display:flex; flex-direction:column; align-items:center; gap: 30px; }
  .reveal-word{
    font-size: clamp(3rem, 12vw, 9rem);
    font-weight: 900;
    letter-spacing: .12em;
    background: linear-gradient(90deg, var(--neon-gold), var(--neon-pink), var(--neon-purple), var(--neon-cyan));
    background-size: 300% 300%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 24px rgba(255,210,74,.5));
    animation: revealZoom .8s cubic-bezier(.2,.8,.2,1.2), gradientShift 4s ease-in-out infinite;
  }
  @keyframes revealZoom{
    0% { transform: scale(.2) rotate(-12deg); opacity: 0;}
    60%{ transform: scale(1.15) rotate(2deg); opacity: 1;}
    100%{ transform: scale(1) rotate(0); opacity: 1;}
  }
  @keyframes gradientShift{
    0%,100%{ background-position: 0% 50%;}
    50%    { background-position: 100% 50%;}
  }
  .sparkles{
    position: fixed; inset: 0; pointer-events: none; overflow: hidden;
  }
  .sparkle{
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: var(--neon-gold);
    box-shadow: var(--glow-gold);
    animation: sparkleFloat 1.6s ease-out forwards;
  }
  @keyframes sparkleFloat{
    0%{ transform: translateY(0) scale(0); opacity:1;}
    50%{ transform: translateY(-80px) scale(1); opacity:1;}
    100%{ transform: translateY(-200px) scale(0); opacity:0;}
  }

  /* =====================================================
     VIDEO SCREEN
     ===================================================== */
  #video-screen{ background: rgba(0,0,0,.92); }
  .video-wrap{
    width: min(1100px, 96vw);
    aspect-ratio: 16/9;
    border-radius: 18px;
    overflow: hidden;
    border: 2px solid var(--neon-blue);
    box-shadow: var(--glow-blue);
    background: #000;
    margin-bottom: 22px;
  }
  .video-wrap iframe{ width:100%; height:100%; border:0; }

  /* =====================================================
     WINNER SCREEN
     ===================================================== */
  #winner-screen{
    background:
      radial-gradient(circle at 20% 30%, rgba(255,210,74,.28), transparent 60%),
      radial-gradient(circle at 80% 70%, rgba(255,45,149,.25), transparent 60%),
      linear-gradient(180deg, var(--bg-2), var(--bg-0));
  }
  .winner-card{
    position: relative; z-index: 2;
    text-align:center; display:flex; flex-direction:column; align-items:center; gap: 24px;
  }
  .trophy{ font-size: 5rem; filter: drop-shadow(0 0 24px rgba(255,210,74,.7)); animation: trophyBounce 2s ease-in-out infinite;}
  @keyframes trophyBounce{ 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-12px);} }
  .winner-banner{
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    letter-spacing: .25em;
    background: linear-gradient(90deg, var(--neon-gold), var(--neon-pink));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(255,210,74,.6));
  }
  .winner-name-input{
    width: min(560px, 90vw);
    padding: 16px 22px;
    font-size: 1.6rem;
    font-weight: 800;
    text-align: center;
    letter-spacing: .15em;
    background: rgba(11,10,36,.7);
    border: 2px solid var(--neon-gold);
    border-radius: 14px;
    color: var(--neon-gold);
    text-shadow: var(--glow-gold);
    outline: none;
    box-shadow: var(--glow-gold), inset 0 0 16px rgba(255,210,74,.15);
  }
  .winner-name-input::placeholder{ color: rgba(255,210,74,.45); letter-spacing: .15em;}
  .confetti-layer{
    position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1;
  }
  .confetto{
    position: absolute; top: -10vh;
    width: 10px; height: 16px;
    opacity: .9;
    animation: confettiFall linear infinite;
  }
  @keyframes confettiFall{
    0%{ transform: translateY(-10vh) rotate(0); }
    100%{ transform: translateY(110vh) rotate(720deg); }
  }

  /* =====================================================
     UTILITIES
     ===================================================== */
  .top-right{
    position: fixed; top: 12px; right: 14px; z-index: 60;
    display:flex; gap:8px;
  }

  @media (max-width: 720px){
    .scoreboard{ grid-template-columns: 1fr; }
    .vs{ text-align:center; padding: 4px 0;}
    .cell{ width: 38px; height: 44px; font-size: 1.1rem;}
    .word-num{ width: 44px; height: 44px; font-size: 1.2rem;}
  }
</style>
</head>
<body>

<!-- ============================================================
     START SCREEN
============================================================ -->
<section id="start-screen" class="screen active">
  <div class="start-stack">
    <div class="show-tag">EL JUEGO DE LAS PROFESIONES</div>
    <h1 class="start-title">¡ADIVINA<br>LA PROFESIÓN!</h1>
    <button id="start-btn" class="neon-btn">▶ START GAME</button>
  </div>
</section>

<!-- ============================================================
     LOGO / INTRO SCREEN
============================================================ -->
<section id="logo-screen" class="screen">
  <div class="logo-wrap">
    <div class="logo-ring"></div>
    <div class="logo-ring r2"></div>
    <div class="logo-ring r3"></div>
    <div class="logo-core">
      <div class="upper">SPANISH CLASS PRESENTS</div>
      <div class="main">¡ADIVINA<br>LA PROFESIÓN!</div>
      <div class="lower">★  EN  VIVO  ★</div>
    </div>
  </div>
</section>

<!-- ============================================================
     MAIN BOARD
============================================================ -->
<section id="board-screen" class="screen">
  <div class="scoreboard">
    <div class="team a">
      <h2>TEAM A</h2>
      <div class="score-block">
        <div class="score" id="score-a">0</div>
        <div class="score-controls">
          <button onclick="adjustScore('a', -1)" aria-label="minus team A">−</button>
          <button onclick="adjustScore('a', 1)"  aria-label="plus team A">+</button>
        </div>
      </div>
    </div>
    <div class="vs">VS</div>
    <div class="team b">
      <h2>TEAM B</h2>
      <div class="score-block">
        <div class="score" id="score-b">0</div>
        <div class="score-controls">
          <button onclick="adjustScore('b', -1)" aria-label="minus team B">−</button>
          <button onclick="adjustScore('b', 1)"  aria-label="plus team B">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="crossword-wrap">
    <div class="crossword" id="crossword"><!-- built by JS --></div>
  </div>

  <div class="board-actions">
    <button id="finish-btn" class="neon-btn gold">🏆 FINISH GAME</button>
  </div>
</section>

<!-- ============================================================
     HINT MODAL
============================================================ -->
<div id="hint-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="modal-close" id="modal-close" aria-label="close">✕</button>
    <h2 id="modal-title">PALABRA #1</h2>

    <div id="emoji-area">
      <button id="hint-btn" class="neon-btn">💡 SHOW HINT</button>
      <div id="modal-emojis" class="modal-emojis hidden"></div>
    </div>

    <div id="final-area" class="hidden">
      <div class="final-note">★ FINAL ROUND ★</div>
      <p style="color:var(--muted); margin-bottom:16px; line-height:1.5;">
        No emojis for the final word.<br>Click below to randomly reveal half its letters.
      </p>
      <button id="final-reveal-half" class="neon-btn pink">🔤 REVEAL HALF LETTERS</button>
    </div>

    <div class="modal-actions" style="margin-top: 18px;">
      <button id="reveal-btn" class="neon-btn gold hidden">✨ REVEAL ANSWER</button>
    </div>
  </div>
</div>

<!-- ============================================================
     REVEAL SCREEN
============================================================ -->
<section id="reveal-screen" class="screen">
  <div class="reveal-wrap">
    <div id="reveal-word" class="reveal-word">PALABRA</div>
    <button id="play-video-btn" class="neon-btn">▶ PLAY VIDEO</button>
  </div>
</section>

<!-- ============================================================
     VIDEO SCREEN
============================================================ -->
<section id="video-screen" class="screen">
  <div class="video-wrap">
    <iframe id="video-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>
  <button id="back-board-btn" class="neon-btn">↩ BACK TO BOARD</button>
</section>

<!-- ============================================================
     WINNER SCREEN
============================================================ -->
<section id="winner-screen" class="screen">
  <div class="confetti-layer" id="confetti-layer"></div>
  <div class="winner-card">
    <div class="trophy">🏆</div>
    <div class="winner-banner">¡CAMPEONES!</div>
    <input id="winner-name" class="winner-name-input" placeholder="TYPE WINNING TEAM…" maxlength="30">
    <button class="neon-btn" onclick="location.reload()">🔄 PLAY AGAIN</button>
  </div>
</section>

<!-- ============================================================
     AUDIO — replace src with your epic intro sound (mp3/ogg)
============================================================ -->
<audio id="intro-sound" preload="auto">
  <!-- REPLACE THIS SRC with your own epic intro sound file -->
  <source src="REPLACE_WITH_YOUR_INTRO_SOUND.mp3" type="audio/mpeg">
</audio>

<script>
/* =====================================================================
   SPANISH CLASS GAME SHOW — PROFESSIONS EDITION
   =====================================================================
   👉 EDIT THIS ARRAY to change the 5 words & emojis used in the game.
   Word 5 is the FINAL ROUND — it does not show emojis; instead, half
   of its letters are revealed at random on the board.

   Each entry:
     id     : 1..5 (order on the board)
     word   : the Spanish answer (use UPPERCASE letters only — A–Z, Ñ allowed)
     emojis : array of 3 emojis (ignored for word 5)
   ===================================================================== */
const WORDS = [
  { id: 1, word: "PROFESOR", emojis: ["📚", "🧑‍🏫", "🎓"] },          // PLACEHOLDER — replace
  { id: 2, word: "DOCTOR",   emojis: ["🩺", "💊", "🏥"] },             // PLACEHOLDER — replace
  { id: 3, word: "BOMBERO",  emojis: ["🔥", "🚒", "💧"] },             // PLACEHOLDER — replace
  { id: 4, word: "COCINERO", emojis: ["🍳", "🧑‍🍳", "🍴"] },           // PLACEHOLDER — replace
  { id: 5, word: "ARTISTA",  emojis: ["🎨", "🖌️", "🖼️"] },           // PLACEHOLDER — replace (FINAL — emojis unused)
];

/* Replace this with your own YouTube embed URL placeholder.
   Use the youtube-nocookie / embed format when you replace it. */
const PLACEHOLDER_VIDEO_URL = "https://www.youtube.com/embed/dQw4w9WgXcQ"; // REPLACE_WITH_YOUR_VIDEO_URL

/* =====================================================================
   STATE
   ===================================================================== */
const state = {
  scores: { a: 0, b: 0 },
  // per-word reveal state: each cell either revealed (true) or not (false)
  reveals: {}, // { 1: [false,false,...], 2: [...], ... }
  solved:  { 1:false, 2:false, 3:false, 4:false, 5:false },
  currentWordId: null,
};

/* =====================================================================
   SCREEN ROUTING
   ===================================================================== */
const screens = ["start-screen","logo-screen","board-screen","reveal-screen","video-screen","winner-screen"];
function showScreen(id){
  screens.forEach(s => document.getElementById(s).classList.toggle("active", s === id));
}

/* =====================================================================
   START → LOGO → BOARD
   ===================================================================== */
document.getElementById("start-btn").addEventListener("click", () => {
  // play intro sound (errors silenced if file is missing — replace the <source>)
  const audio = document.getElementById("intro-sound");
  try { audio.currentTime = 0; audio.play().catch(()=>{}); } catch(_){}

  showScreen("logo-screen");
  setTimeout(() => {
    buildCrossword();
    showScreen("board-screen");
  }, 3000);
});

/* =====================================================================
   SCOREBOARD
   ===================================================================== */
function adjustScore(team, delta){
  state.scores[team] = Math.max(0, state.scores[team] + delta);
  document.getElementById("score-" + team).textContent = state.scores[team];
}

/* =====================================================================
   BUILD CROSSWORD
   - Each word is a row: [number-cell] [letter cells…]
   - Letter cells start blank; reveal flips them in
   ===================================================================== */
function buildCrossword(){
  const root = document.getElementById("crossword");
  root.innerHTML = "";
  WORDS.forEach(w => {
    if(!state.reveals[w.id]) state.reveals[w.id] = w.word.split("").map(()=>false);

    const row = document.createElement("div");
    row.className = "word-row";

    const num = document.createElement("button");
    num.className = "word-num" + (state.solved[w.id] ? " done" : "");
    num.textContent = w.id;
    num.setAttribute("aria-label", "Open word " + w.id);
    num.addEventListener("click", () => openHintModal(w.id));
    row.appendChild(num);

    w.word.split("").forEach((ch, idx) => {
      const cell = document.createElement("div");
      cell.className = "cell" + (state.reveals[w.id][idx] ? " revealed" : "");
      cell.dataset.wid = w.id;
      cell.dataset.idx = idx;
      cell.textContent = state.reveals[w.id][idx] ? ch : "";
      row.appendChild(cell);
    });

    root.appendChild(row);
  });
}

/* =====================================================================
   HINT MODAL
   ===================================================================== */
const modal       = document.getElementById("hint-modal");
const modalTitle  = document.getElementById("modal-title");
const emojiArea   = document.getElementById("emoji-area");
const finalArea   = document.getElementById("final-area");
const modalEmojis = document.getElementById("modal-emojis");
const hintBtn     = document.getElementById("hint-btn");
const revealBtn   = document.getElementById("reveal-btn");
const finalHalf   = document.getElementById("final-reveal-half");

function openHintModal(wid){
  state.currentWordId = wid;
  const w = WORDS.find(x => x.id === wid);
  modalTitle.textContent = "PALABRA #" + wid;

  // reset modal sub-UI
  modalEmojis.innerHTML = "";
  modalEmojis.classList.add("hidden");
  hintBtn.classList.remove("hidden");
  revealBtn.classList.add("hidden");

  if (wid === 5) {
    // FINAL ROUND — no emojis, only "reveal half letters" + reveal answer
    emojiArea.classList.add("hidden");
    finalArea.classList.remove("hidden");
    revealBtn.classList.remove("hidden"); // host can also reveal full answer at any time
  } else {
    emojiArea.classList.remove("hidden");
    finalArea.classList.add("hidden");
  }

  modal.classList.add("active");
}

function closeModal(){
  modal.classList.remove("active");
  state.currentWordId = null;
}

document.getElementById("modal-close").addEventListener("click", closeModal);
modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

hintBtn.addEventListener("click", () => {
  const w = WORDS.find(x => x.id === state.currentWordId);
  if (!w) return;
  modalEmojis.classList.remove("hidden");
  modalEmojis.innerHTML = w.emojis.map(e => `<span>${e}</span>`).join("");
  hintBtn.classList.add("hidden");
  revealBtn.classList.remove("hidden");
});

/* =====================================================================
   FINAL ROUND — reveal half the letters at random on the board
   ===================================================================== */
finalHalf.addEventListener("click", () => {
  const w = WORDS.find(x => x.id === 5);
  if (!w) return;
  const arr = state.reveals[5];
  const total = w.word.length;
  const half  = Math.ceil(total / 2);

  // collect indices not yet revealed and pick enough to reach `half`
  const remainingIdx = arr.map((v,i)=>v?-1:i).filter(i=>i>=0);
  const alreadyRevealed = arr.filter(Boolean).length;
  const need = Math.max(0, half - alreadyRevealed);

  // shuffle
  for (let i = remainingIdx.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [remainingIdx[i], remainingIdx[j]] = [remainingIdx[j], remainingIdx[i]];
  }
  remainingIdx.slice(0, need).forEach(i => arr[i] = true);

  closeModal();
  buildCrossword();
});

/* =====================================================================
   REVEAL FULL ANSWER (winning team got it right!)
   ===================================================================== */
revealBtn.addEventListener("click", () => {
  const wid = state.currentWordId;
  if (!wid) return;
  const w = WORDS.find(x => x.id === wid);

  // mark all cells revealed + solved
  state.reveals[wid] = w.word.split("").map(()=>true);
  state.solved[wid] = true;

  // close hint modal, redraw board (silently in background)
  closeModal();
  buildCrossword();

  // big reveal screen
  document.getElementById("reveal-word").textContent = w.word;
  showScreen("reveal-screen");
  spawnSparkles(40);
});

/* sparkles on reveal screen */
function spawnSparkles(n){
  // remove old
  document.querySelectorAll(".sparkles").forEach(el => el.remove());
  const layer = document.createElement("div");
  layer.className = "sparkles";
  document.body.appendChild(layer);
  for (let i=0; i<n; i++){
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = Math.random()*100 + "vw";
    s.style.top  = (50 + Math.random()*30) + "vh";
    s.style.animationDelay = (Math.random()*0.6) + "s";
    s.style.background = ["var(--neon-gold)","var(--neon-cyan)","var(--neon-pink)","var(--neon-purple)"][Math.floor(Math.random()*4)];
    layer.appendChild(s);
  }
  setTimeout(()=>layer.remove(), 2200);
}

/* =====================================================================
   PLAY VIDEO
   ===================================================================== */
document.getElementById("play-video-btn").addEventListener("click", () => {
  const iframe = document.getElementById("video-iframe");
  // Add autoplay param. Replace PLACEHOLDER_VIDEO_URL above with your own video.
  const sep = PLACEHOLDER_VIDEO_URL.includes("?") ? "&" : "?";
  iframe.src = PLACEHOLDER_VIDEO_URL + sep + "autoplay=1&rel=0";
  showScreen("video-screen");
});

/* =====================================================================
   BACK TO BOARD — replays logo briefly, then returns
   ===================================================================== */
document.getElementById("back-board-btn").addEventListener("click", () => {
  // stop video
  const iframe = document.getElementById("video-iframe");
  iframe.src = "";

  showScreen("logo-screen");
  setTimeout(() => {
    buildCrossword();
    showScreen("board-screen");
  }, 1800);
});

/* =====================================================================
   FINISH GAME → WINNER SCREEN
   ===================================================================== */
document.getElementById("finish-btn").addEventListener("click", () => {
  // pre-fill with the leading team
  const winnerInput = document.getElementById("winner-name");
  if (state.scores.a > state.scores.b) winnerInput.value = "TEAM A";
  else if (state.scores.b > state.scores.a) winnerInput.value = "TEAM B";
  else winnerInput.value = "";
  showScreen("winner-screen");
  startConfetti();
});

/* =====================================================================
   CONFETTI
   ===================================================================== */
let confettiInterval = null;
function startConfetti(){
  const layer = document.getElementById("confetti-layer");
  layer.innerHTML = "";
  if (confettiInterval) clearInterval(confettiInterval);
  const colors = ["#00e5ff","#b026ff","#ff2d95","#ffd24a","#29ffe7","#ffffff"];
  function piece(){
    const c = document.createElement("div");
    c.className = "confetto";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.width  = (6 + Math.random()*8) + "px";
    c.style.height = (10 + Math.random()*16) + "px";
    c.style.animationDuration = (3 + Math.random()*3) + "s";
    c.style.animationDelay = (Math.random()*0.6) + "s";
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    c.style.opacity = .8 + Math.random()*0.2;
    layer.appendChild(c);
    setTimeout(()=>c.remove(), 6500);
  }
  // initial burst
  for (let i=0; i<80; i++) piece();
  // continuous trickle
  confettiInterval = setInterval(()=>{
    for (let i=0; i<6; i++) piece();
  }, 220);
}

/* =====================================================================
   KEYBOARD HELPERS — quick host controls
   ===================================================================== */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});
</script>
</body>
</html>
